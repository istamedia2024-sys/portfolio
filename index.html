<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ista Media</title>

  <meta name="description" content="Contact Ista Media through phone, WhatsApp, or email." />

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      background:#f4f7fb;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:30px;
      color:#222;
    }

    .contact-wrapper{
      width:100%;
      max-width:550px;
    }

    .contact-card{
      background:#ffffff;
      border-radius:22px;
      padding:50px 35px;
      box-shadow:0 15px 40px rgba(0,0,0,0.08);
      text-align:center;
    }

    .contact-card h1{
      font-size:38px;
      margin-bottom:15px;
      color:#0B1F3B;
      font-weight:700;
    }

    .contact-card p{
      font-size:17px;
      line-height:1.7;
      color:#666;
      margin-bottom:35px;
    }

    .contact-buttons{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .contact-btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      text-decoration:none;
      padding:18px 20px;
      border-radius:14px;
      font-size:18px;
      font-weight:600;
      transition:0.3s ease;
    }

    .contact-btn:hover{
      transform:translateY(-4px);
    }

    .phone-btn{
      background:#0B1F3B;
      color:#fff;
    }

    .whatsapp-btn{
      background:#25D366;
      color:#fff;
    }

    .email-btn{
      background:#eceff3;
      color:#0B1F3B;
    }

    @media(max-width:768px){

      .contact-card{
        padding:40px 25px;
      }

      .contact-card h1{
        font-size:30px;
      }

      .contact-btn{
        font-size:16px;
        padding:16px;
      }

    }
  </style>
</head>

<body>

  <div class="contact-wrapper">

    <div class="contact-card">

      <h1>Ista Media</h1>

      <p>
        Contact us directly through phone, WhatsApp, or email for inquiries and services.
      </p>

      <div class="contact-buttons">

        <a class="contact-btn phone-btn" href="tel:+905523849474">
          +90 552 384 9474
        </a>

        <a class="contact-btn whatsapp-btn" href="https://wa.me/905523849474" target="_blank">
          WhatsApp
        </a>

        <a class="contact-btn email-btn" href="mailto:istamedia2024@gmail.com">
          istamedia2024@gmail.com
        </a>

      </div>

    </div>

  </div>

</body>

</html>
